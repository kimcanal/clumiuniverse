name: 토스 메뉴 자동 동기화

# 매일 한국시간(KST) 새벽 6시에 자동 실행 + 필요하면 수동 실행(workflow_dispatch)도 가능
on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = KST 06:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync-toss-menu:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 토스 메뉴 최신화 (기존 스크립트 재사용)
        run: node scripts/fetch-toss-menu.mjs

      - name: 변경사항 있으면 자동 커밋 & 푸시
        run: |
          git config user.name "clumi-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tossplace-menu
          if git diff --cached --quiet; then
            echo "변경된 메뉴 없음 — 커밋 생략"
          else
            git commit -m "chore: 토스 메뉴 자동 업데이트 [skip ci]"
            git push
          fi
