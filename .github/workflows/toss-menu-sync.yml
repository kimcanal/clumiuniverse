name: 토스 메뉴 자동 동기화

# 매일 한국시간(KST) 새벽 6시에 자동 실행 + 필요하면 수동 실행(workflow_dispatch)도 가능
on:
  schedule:
    - cron: '0 21 * * *' # UTC 21:00 = KST 06:00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: toss-menu-sync
  cancel-in-progress: false

jobs:
  sync-toss-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: WebP 이미지 도구 설치
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: 토스 메뉴 최신화 (기존 스크립트 재사용)
        run: node scripts/fetch-toss-menu.mjs

      - name: 사이트용 메뉴 생성 및 검증
        run: |
          node scripts/generate-site-data.mjs
          node scripts/validate-site.mjs

      - name: 변경사항 있으면 자동 커밋 & 푸시
        run: |
          git config user.name "clumi-menu-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tossplace-menu data/site-menu.json data/order-menu.json data/featured.json
          if git diff --cached --quiet; then
            echo "변경된 메뉴 없음 — 커밋 생략"
          else
            git commit -m "chore: 토스 메뉴 자동 업데이트"
            git push
          fi

      - name: 실패 시 이슈로 알림
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation-failure',
            });
            if (openIssues.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssues[0].number,
                body: `또 실패했습니다: ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 토스 메뉴 자동 동기화 실패',
                body: `토스 메뉴 자동 동기화 워크플로우가 실패했습니다.\n\n실행 로그: ${runUrl}`,
                labels: ['automation-failure'],
              });
            }

      - name: 복구 시 실패 이슈 닫기
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'automation-failure',
            });
            for (const issue of openIssues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: '이후 실행이 정상적으로 성공해 자동으로 닫습니다.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
